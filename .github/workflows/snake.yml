name: Generate Snake
on:
  schedule: [{cron: "0 */24 * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AayushNeupane1
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f5a0&color_dots=#302b63,#5f27cd,#8a2be2,#00f5a0,#ffffff
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
